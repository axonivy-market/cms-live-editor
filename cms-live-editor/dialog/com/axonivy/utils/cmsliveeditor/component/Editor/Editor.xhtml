<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core"
  xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets"
  xmlns:cc="jakarta.faces.composite" xmlns:ic="http://ivyteam.ch/jsf/component"
  xmlns:p="primefaces" xmlns:pe="primefaces.extensions"
  xmlns:c="jakarta.tags.core">

<cc:interface componentType="IvyComponent">
  <cc:attribute name="managedBean" required="true" />
  <cc:attribute name="content" required="true" />
  <cc:attribute name="originalContent" default="" />
  <cc:attribute name="languageIndex" required="true" />
  <cc:attribute name="isHtmlFormat" default="false" />
  <cc:attribute name="isReadOnly" default="false" />
</cc:interface>
<cc:implementation>
  <ui:param name="isSameContent"
    value="#{cc.attrs.managedBean.isTheSameContent(cc.attrs.originalContent, cc.attrs.content)}" />

  <h:outputStylesheet name="suneditor/css/suneditor.min.css" />
  <h:outputStylesheet name="suneditor/css/suneditor-custom.css" />
  <h:outputScript name="suneditor/suneditor.min.js" target="head" />

  <h:panelGroup rendered="#{cc.attrs.isReadOnly}">
    <h:panelGroup rendered="#{isSameContent}">
      <h:outputText value="#{cc.attrs.content}" escape="#{not cc.attrs.isHtmlFormat}" />
    </h:panelGroup>

    <h:panelGroup rendered="#{not isSameContent}">
      <del class="cms-original-content">
        <h:outputText value="#{cc.attrs.originalContent}" escape="#{not cc.attrs.isHtmlFormat}" />
      </del>
      <h:outputText value="#{cc.attrs.content}" escape="#{not cc.attrs.isHtmlFormat}" />
    </h:panelGroup>
  </h:panelGroup>

  <!-- EDIT MODE -->
  <h:panelGroup rendered="#{not cc.attrs.isReadOnly}">
    <p:inputTextarea id="content-editor-id" value="#{cc.attrs.content}" styleClass="js-article-content-editor hidden"
      autoResize="false">
      <f:attribute name="languageIndex" value="#{cc.attrs.languageIndex}" />
      <f:validator validatorId="cmsLiveEditorValidator" />
    </p:inputTextarea>
  </h:panelGroup>

  <p:remoteCommand autoRun="true" async="true" rendered="#{not cc.attrs.isReadOnly}"
    onstart="initSunEditor(#{cc.attrs.languageIndex}, '#{cc.clientId}:content-editor-id', #{cc.attrs.isHtmlFormat});"
    global="false" process="@none" update="@none" immediate="true" />

  <p:remoteCommand name="setValueChanged" global="false" partialSubmit="true" process="@this"
    actionListener="#{cc.attrs.managedBean.setValueChanged}" />
</cc:implementation>

</html>
